<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">Mux Beacon pane-border badge preview</title>
  <desc id="description">A tmux window split into three panes with Working, Ready, and Failed labels drawn into the top pane borders.</desc>
  <rect width="1200" height="540" rx="22" fill="#17191d"/>
  <rect x="1" y="1" width="1198" height="538" rx="21" fill="none" stroke="#343942" stroke-width="2"/>
  <circle cx="34" cy="32" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="32" r="7" fill="#febc2e"/>
  <circle cx="82" cy="32" r="7" fill="#28c840"/>
  <text x="600" y="39" text-anchor="middle" fill="#8d96a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Ghostty · tmux</text>

  <line x1="20" y1="76" x2="1180" y2="76" stroke="#59616d" stroke-width="2"/>
  <rect x="36" y="64" width="300" height="26" rx="5" fill="#17191d"/>
  <text x="44" y="83" fill="#3291ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">● WORKING</text>
  <text x="166" y="83" fill="#d5dae2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">codex-api</text>
  <text x="283" y="83" fill="#77808d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">0</text>

  <line x1="694" y1="76" x2="694" y2="520" stroke="#59616d" stroke-width="2"/>
  <line x1="694" y1="76" x2="1180" y2="76" stroke="#59616d" stroke-width="2"/>
  <rect x="712" y="64" width="270" height="26" rx="5" fill="#17191d"/>
  <text x="720" y="83" fill="#32d66b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">● READY</text>
  <text x="817" y="83" fill="#d5dae2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">claude-ui</text>
  <text x="935" y="83" fill="#77808d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">1</text>

  <line x1="20" y1="310" x2="694" y2="310" stroke="#59616d" stroke-width="2"/>
  <rect x="36" y="298" width="302" height="26" rx="5" fill="#17191d"/>
  <text x="44" y="317" fill="#ff5864" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">● FAILED</text>
  <text x="153" y="317" fill="#d5dae2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">worker-tests</text>
  <text x="295" y="317" fill="#77808d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">2</text>

  <g fill="#adb5c2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <text x="42" y="126">❯ codex</text>
    <text x="42" y="164" fill="#6f7886">Working on the lifecycle adapter…</text>
    <text x="720" y="126">❯ claude</text>
    <text x="720" y="164" fill="#6f7886">Finished. Waiting for your next prompt.</text>
    <text x="42" y="362">❯ swift test</text>
    <text x="42" y="400" fill="#ff7780">error: testDurationExport failed</text>
  </g>
  <text x="720" y="496" fill="#56606e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Pane borders only; window names and status labels stay untouched.</text>
</svg>
